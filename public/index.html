<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Standards Conference</title>
  <meta name="description" content="GraphQL + AsyncAPI + OpenAPI + JSON Schema. Coming soon.">
  <link rel="icon" href="logo.png">
  <style>
    :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1rem;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    img { width: min(320px, 70vw); height: auto; }
    h1 { margin: 0; font-size: clamp(1.25rem, 4vw, 2rem); font-weight: 600; }
    p { margin: 0; font-size: 1.25rem; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  </style>
</head>
<body>
  <img src="logo.png" alt="API Standards conference logo">
  <h1>GraphQL + AsyncAPI + OpenAPI + JSON Schema</h1>
  <p>Coming soon</p>
</body>
</html>
